# latkit DaemonSet (Р47) — one agent per node, capturing every postgres (or
# MySQL, HTTP/1.x server, or S3/MinIO) on the node kernel-side. Single file, no
# Helm (v1 scope); configuration is the LATKIT_* env layer (Р34) right in this
# manifest.
#
#   kubectl apply -f latkit-daemonset.yaml
#
# Image: the manifest expects a locally available release image (built with
# `docker build -f deploy/docker/Dockerfile -t latkit:latest .`); replace with
# your registry copy, or with the ghcr.io release image once tags are published
# (task 7.6). On kind: `kind load docker-image latkit:latest`.
#
# Pod Security Admission: this pod needs hostPID and extra capabilities, so on
# PSA-enforced clusters the target namespace must allow it:
#   kubectl label ns <ns> pod-security.kubernetes.io/enforce=privileged
#
# Operator notes (capability rationale, cgroup globs, kind specifics):
# docs/deploy.md.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: latkit
  labels:
    app.kubernetes.io/name: latkit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: latkit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: latkit
      annotations:
        # Plain-Prometheus discovery. Running prometheus-operator instead?
        # Use a PodMonitor selecting app.kubernetes.io/name=latkit on port
        # `metrics` — we do not ship the CRD.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9752"
        prometheus.io/path: "/metrics"
    spec:
      # Mandatory for TLS capture (Р39): the libssl autodetect reads
      # /proc/<pid>/maps and opens /proc/<pid>/root/... of the postgres
      # processes, which must be visible in the agent's PID namespace.
      # Plaintext-only capture works without it, but keeping it on is simpler
      # and costs nothing.
      hostPID: true
      # hostNetwork is NOT needed: fentry capture sees every netns of the node
      # kernel by definition, and /metrics is a normal pod port.
      containers:
        - name: latkit
          image: latkit:latest
          imagePullPolicy: IfNotPresent
          env:
            # The image default binds loopback (Р29); a pod must listen on the
            # pod IP for the kubelet probes and Prometheus to reach it.
            - name: LATKIT_PROM_LISTEN
              value: "0.0.0.0:9752"
            - name: LATKIT_PORT
              value: "5432"
            # MySQL/MariaDB, HTTP, S3 or Redis instead of (or alongside)
            # postgres: name the port's wire protocol, e.g. "3306=mysql",
            # "5432,3306=mysql", "8080=http,8443=http", "9000=s3" or
            # "6379=redis" (a bare number defaults to pg). LATKIT_PORT takes the
            # whole comma-separated list in one value; the CLI flag is
            # repeatable instead, one port per -p.
            # Do NOT add
            # LATKIT_COMM=mysqld — that per-thread kernel filter drops every
            # event on MySQL 8.x, whose session threads are named `connection`
            # (MYSQL.md М5); web-server threads are not named after their binary
            # either. The default TLS scan set already follows the protocols
            # configured here.
            #
            # An http port observes ingress/ingress-controller and sidecar
            # traffic without touching either. Two caveats worth knowing before
            # you point it at a service mesh (README "Known limitations"):
            # HTTP/2 — hence gRPC — is a declared blind zone, counted as
            # latkit_ignored_conns_total{reason="h2"}, and a body sent with
            # sendfile(2) may not cross the capture point at all. Both are
            # counters on the "latkit — HTTP" dashboard, never silence.
            # Route templating needs no configuration; if it mis-reads your API
            # (watch the route="other" share), mount a route map and set
            # LATKIT_HTTP_ROUTES — see deploy/demo-http/routes.map.
            #
            # An s3 port ("9000=s3") reads the same HTTP/1.1 wire as the S3 API:
            # operation instead of route, bucket instead of Host, the access key
            # out of the signature as `user`, the symbolic S3 code out of the
            # error body. The object key is never a label. For a MinIO tenant
            # (operator or Helm chart) name the S3 port; the pool's own traffic
            # arrives on it too and is kept apart rather than mixed in: the grid
            # multiplexer is binary msgp inside a websocket and is
            # dropped-and-counted whole (ignored_conns_total{reason="upgrade"}),
            # while the /minio/* requests — peer RPC, kubelet's probes above all
            # — are counted as latkit_s3_internal_requests_total and become no
            # observation. On a pool that is most of the port's traffic.
            # TLS of an S3 port is Go-only (MinIO maps no libssl): see
            # LATKIT_TLS_GO below — it is the sole channel there.
            #
            # A redis port ("6379=redis") reads RESP2/RESP3 — Redis, Valkey,
            # KeyDB, Dragonfly and Sentinel (26379) are the same wire. Three
            # things are worth knowing before pointing it at a cache in a
            # cluster:
            #   - THE UNIX SOCKET IS INVISIBLE. Capture is on tcp_sendmsg /
            #     tcp_recvmsg, so a client that connects over /run/redis.sock —
            #     which is a real deployment shape when the application and the
            #     cache share a pod — produces nothing at all, not a degraded
            #     something. `redis-cli config get unixsocket` says whether the
            #     server even offers one; the official images and the
            #     Debian/Ubuntu packages do not, the Alpine package does.
            #   - a CLUSTER's bus is the client port + 10000 and is binary
            #     gossip, not RESP: capture the client port only, one agent per
            #     node. `-MOVED`/`-ASK` on the client port are counted as
            #     redirects rather than errors, so a resharding cluster does not
            #     read as an outage.
            #   - the per-port capture budget defaults to 512 bytes here, which
            #     holds a command whole. A reply that is a long ARRAY (SCAN with
            #     a big COUNT, KEYS, LRANGE over a long list) does not fit and
            #     cannot be skipped arithmetically the way a bulk can, so that
            #     command is not observed: raise it with "6379=redis:4096" if
            #     your workload scans keyspaces (deploy/existing-redis).
            # A tls-port Redis needs only LATKIT_TLS=auto below — every build
            # measured links libssl dynamically, and the uprobe gate follows the
            # server's own io threads (io_thd_*) without configuration.
            #
            # TLS capture of postgres running with ssl=on (stage 6). Needs the
            # SYS_PTRACE + SYS_ADMIN capabilities below.
            - name: LATKIT_TLS
              value: "auto"
            # TLS plaintext of a GO server (MinIO, Caddy, Traefik, any
            # net/http): there is no libssl to scan for, so the binary is named
            # and crypto/tls is probed inside it. A uprobe binds to an INODE, so
            # the path must resolve to the very file the server runs. In a
            # cluster that means one of:
            #   - the server runs on the node (a DaemonSet MinIO, a host
            #     install): hostPath-mount the binary read-only and name the
            #     mount path;
            #   - the server runs in a pod: the path is
            #     /proc/<pid>/root/usr/bin/minio, which only exists once the pod
            #     does — resolve it at start (hostPID: true is already set) or
            #     accept the port as a named blind zone;
            #   - or terminate TLS at the ingress and capture the plaintext hop
            #     behind it, which is the simplest answer in a cluster.
            # A binary that cannot be hooked is fatal at startup with the cause,
            # never a dashboard that is quietly flat.
            #- name: LATKIT_TLS_GO
            #  value: "/host/usr/local/bin/minio"
            # Capture only the postgres pods you mean, not every 5432 talker on
            # the node (Р48): comma-separated globs over /sys/fs/cgroup — on a
            # systemd-cgroup-driver node a pod lives under
            #   kubepods.slice/kubepods-<qos>.slice/kubepods-<qos>-pod<uid>.slice/cri-containerd-<cid>.scope
            # (see docs/deploy.md for cgroupfs-driver and kind paths), so e.g.:
            #- name: LATKIT_CGROUP
            #  value: "kubepods.slice/**"
          ports:
            - name: metrics
              containerPort: 9752
          securityContext:
            capabilities:
              add:
                # Measured minimal set (docs/deploy.md "Minimal capabilities"):
                #   BPF + PERFMON        programs, maps, fentry attach
                #   SYS_RESOURCE         memlock rlimit on kernels < 5.11 only
                #   SYS_PTRACE+SYS_ADMIN TLS uprobes (LATKIT_TLS=auto); the
                #                        kernel wants full CAP_SYS_ADMIN for
                #                        uprobes. Plaintext-only? Drop both.
                - BPF
                - PERFMON
                - SYS_RESOURCE
                - SYS_PTRACE
                - SYS_ADMIN
            # Fallback for runtimes/kernels that cannot express the fine-grained
            # set (older runc, exotic LSM policies): replace `capabilities`
            # with:
            #privileged: true
          volumeMounts:
            # cgroup-path resolution for the LATKIT_CGROUP filter (Р48): the
            # agent globs /sys/fs/cgroup and maps matches to cgroup ids.
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
          resources:
            # Measured (stage 8.1, docs/perf.md): 0.31 cores per 50k queries/s
            # plaintext, 0.45 with TLS; RSS ~25 MiB under load at the default
            # table sizes. The CPU limit equals the v1.0 budget at the 50k
            # target; memory headroom covers larger LATKIT_TOP_QUERIES /
            # LATKIT_MAX_CONNS. Past its CPU the agent drops-and-counts
            # rather than degrading silently.
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
      # Pin to the nodes that actually run postgres if you label them:
      #nodeSelector:
      #  latkit.io/capture: "true"
      # No control-plane tolerations on purpose — postgres does not live there.

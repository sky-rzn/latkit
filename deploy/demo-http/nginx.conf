# nginx for the latkit HTTP demo (PLAN-HTTP.md М9). Two roles in one config,
# because both are what nginx is actually deployed as and the agent meets each
# of them differently:
#
#   - **static file server** with `sendfile on` (nginx's default, and the
#     reason РH4 exists): the body of /static/* leaves the kernel without a
#     socket write. On kernels since ~6.5 it is routed through sendmsg anyway
#     and the bytes are still accounted; on older ones bytes_out becomes a
#     lower bound and the observation is flagged. Either way the demo shows
#     you which world you are in — see the "Blind zones" panel;
#   - **reverse proxy** to the Go backend, with its upstream leg observed on
#     its own port (8081). One deployment, two legs, two sets of latencies
#     that must not be averaged together.
#
# There is deliberately no `access_log`: the point of the demo is a dashboard
# from a server that was told nothing and instrumented with nothing.
worker_processes 1;
events {
    worker_connections 1024;
}

http {
    access_log off;
    default_type text/plain;
    sendfile on;

    upstream app {
        server backend:8081;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        # Any Host is served. The load sends two of them on purpose: `host` is
        # a label of its own (РH10 — it takes the `db` slot), taken per request
        # rather than per connection, so one keep-alive socket can and does
        # carry several virtual hosts.
        server_name _;

        # The static half. big.bin is generated at container start — a binary
        # blob does not belong in a git tree.
        location /static/ {
            root /www;
        }

        # The same bytes written through the socket instead of sendfile: the
        # comparison that makes the sendfile case legible rather than
        # mysterious.
        location /nosendfile/ {
            sendfile off;
            alias /www/static/;
        }

        # Answered by nginx itself: the front leg has traffic of its own, not
        # only proxied traffic.
        location = /hello {
            return 200 "hello\n";
        }

        location = /healthz {
            return 200 "ok\n";
        }

        # The proxy half. proxy_http_version 1.1 + an empty Connection header
        # keeps the upstream leg keep-alive instead of one connection per
        # request — which is both what a real deployment does and what makes
        # the 8081 series interesting.
        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # The upstream leg is given a Host of its own — nginx's own default
            # ($proxy_host), spelled out. It matters for what you see: the HTTP
            # label set has no port in it (a port is a deployment detail, and a
            # label of it would double every series), so the two legs are told
            # apart by `host`. Preserving the client's Host here instead —
            # `proxy_set_header Host $host`, the other common choice — would
            # merge them into one series, which is a legitimate thing to want
            # and a surprising thing to get by accident.
            proxy_set_header Host backend;
            # Passed through, not generated: whatever traceparent the client
            # sent reaches the upstream leg too, so the same trace id shows up
            # on both legs' spans (РH11).
            proxy_set_header traceparent $http_traceparent;
            # nginx's own request id, echoed to the client and put on the span
            # by the agent — the join key the accuracy bench uses
            # (docs/accuracy.md).
            proxy_set_header X-Request-Id $request_id;
            add_header X-Request-Id $request_id always;
        }
    }
}

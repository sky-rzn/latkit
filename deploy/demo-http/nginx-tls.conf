# The HTTPS front of the demo's `tls` profile (PLAN-HTTP.md М9, РH13.1).
#
# Deliberately **HTTP/1.1 only**: `http2` is off, so ALPN never negotiates h2
# and every exchange is one this agent can read. That is not a trick to make
# the demo look good — h2 is a declared blind zone (README, plan §8), and a
# stack that quietly served h2 would be demonstrating the blind-zone counter
# rather than the TLS channel.
#
# Same routes as the plaintext front, minus the static half: what this profile
# has to show is that an observation from a ciphertext socket is
# indistinguishable from a cleartext one, and the routes it is made of are
# beside the point.
worker_processes 1;
events {
    worker_connections 512;
}

http {
    access_log off;
    default_type text/plain;

    upstream app_tls {
        server backend:8081;
        keepalive 16;
    }

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location = /hello {
            return 200 "hello\n";
        }

        location = /healthz {
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://app_tls;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host backend;   # its own leg, its own `host` label
            proxy_set_header traceparent $http_traceparent;
            proxy_set_header X-Request-Id $request_id;
        }
    }
}

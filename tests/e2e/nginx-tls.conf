# nginx for the HTTPS e2e stand (PLAN-HTTP.md М7). Deliberately HTTP/1.1 only:
# `http2` is off, so ALPN never negotiates h2 and every exchange is one this
# agent can read. That is not a trick to make the test pass — h2 is a declared
# blind zone (§8 of the plan), and a stand that quietly measured h2 would be
# measuring the blind-zone counter instead of the TLS channel.
worker_processes 1;
events {
    worker_connections 256;
}

http {
    access_log off;
    default_type text/plain;

    server {
        listen 8443 ssl;
        server_name latkit-stand;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # The routes the verify script looks for: a fixed path, an
        # id-bearing one (which must come back templated as /json/{id}), and
        # deliberate 404/500 so the status families have data.
        location = /hello {
            return 200 "hello\n";
        }
        location /json/ {
            return 200 "{\"ok\":true}\n";
        }
        location = /boom {
            return 500 "boom\n";
        }
        location / {
            return 404 "nope\n";
        }
    }
}

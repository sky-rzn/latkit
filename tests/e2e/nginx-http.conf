# nginx for the plaintext HTTP e2e stand (PLAN-HTTP.md М8). Two modes in one
# config, because they are nginx's two real ones and the agent meets both:
#
#   - a **static file server** with `sendfile on` (the default, and the reason
#     РH4 exists at all): the body of /static/* leaves through sendfile and
#     never appears in a socket write. Since ~6.5 the kernel routes it through
#     sendmsg anyway, so the bytes are still accounted — М0 measured that, and
#     the stand is where the claim is checked against a live kernel rather than
#     a recorded trace;
#   - a **reverse proxy** to the Go backend, whose upstream leg is observed on
#     its own port. One deployment, two legs, both with their own labels.
#
# HTTP/1.1 everywhere, upstream included (nginx defaults to 1.0 to upstreams,
# which would silently keep keep-alive out of the stand).
worker_processes 1;
events {
    worker_connections 512;
}

http {
    access_log off;
    default_type text/plain;
    sendfile on;

    upstream app {
        server backend:8081;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name latkit-stand;

        # The static half: an 8 MB file through sendfile, and a small one.
        location /static/ {
            root /www;
        }

        # The same files written through the socket instead. This is the only
        # path where the per-call capture budget (РH14) actually bites: a
        # sendfile body reaches tcp_sendmsg as a page iterator the probe cannot
        # copy from at all (М0 recon item 1), so its capture is empty whatever
        # the budget says, while these bytes are copied and the budget is what
        # decides how many. The perf bench uses it for exactly that comparison.
        location /nosendfile/ {
            sendfile off;
            alias /www/static/;
        }

        # Answered by nginx itself, without the backend: the fixed route the
        # verify script counts on being present whatever the backend does.
        location = /hello {
            return 200 "hello\n";
        }

        # The proxy half. proxy_http_version 1.1 + an empty Connection header
        # is what keeps the upstream leg keep-alive rather than one connection
        # per request.
        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # The join key of the accuracy bench (М8): nginx's own request id,
            # echoed to the client and logged, so an observation and a log line
            # can be matched one to one rather than in aggregate.
            proxy_set_header X-Request-Id $request_id;
            add_header X-Request-Id $request_id always;
        }
    }
}

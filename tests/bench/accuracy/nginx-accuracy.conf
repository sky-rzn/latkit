# nginx for the HTTP accuracy stand (PLAN-HTTP.md М8). Three things it must do
# that the e2e stand's config does not:
#
#   1. **log the join key.** `$http_x_request_id` is the id the *client* put on
#      the wire, so it is present in the agent's view of the front leg too —
#      nginx's own `$request_id` would only appear upstream, where it is added.
#   2. **log the reference numbers**: `$request_time` (the whole exchange as
#      nginx sees it), `$upstream_response_time` (the upstream leg), and
#      `$body_bytes_sent` (the response body, without headers — the same thing
#      the agent counts).
#   3. **name the upstream leg.** `Host: upstream-app` makes the two legs of the
#      proxy unambiguous in the agent's output: the front leg carries the
#      client's `Host`, this one carries a name nothing else uses.
worker_processes 1;
events {
    worker_connections 512;
}

http {
    default_type text/plain;
    sendfile on;

    log_format acc escape=json
        '{"id":"$http_x_request_id","status":$status,"method":"$request_method",'
        '"uri":"$uri","rt":$request_time,"urt":"$upstream_response_time",'
        '"bs":$body_bytes_sent,"br":$request_length,'
        '"te":"$sent_http_transfer_encoding"}';
    access_log /var/log/nginx/acc.log acc;

    upstream app {
        server backend:8081;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name latkit-accuracy;

        location /static/ {
            root /www;
        }

        location = /hello {
            return 200 "hello\n";
        }

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host upstream-app;
            proxy_set_header X-Request-Id $http_x_request_id;
        }
    }
}

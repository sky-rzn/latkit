# SPDX-License-Identifier: GPL-2.0
# М0 trace-corpus + reconnaissance stand: nginx as static server, reverse proxy
# and TLS/h2 terminator. Mounted over /etc/nginx/nginx.conf; the Go backend
# lives on the host and nginx runs with --network host, see record.sh / recon.sh.
#
# nginx implements the same route contract as the other corpus backends —
# statically where it can (/hello, /big, /boom, /redirect), by proxying to the
# Go backend where a file server cannot (/echo, /chunked, /slow, /ws,
# /truncate, /json/). That is not a workaround: static and reverse proxy are
# nginx's two real modes and the corpus needs both.
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log off;

    # Every field the М0 reconnaissance needs, so one stand answers items
    # 1/2/4/5: response framing (chunked vs Content-Length, ours and the
    # upstream's), negotiated protocol, request header block size
    # ($request_length = request line + headers + body) and response header
    # block size ($bytes_sent - $body_bytes_sent). $request_time /
    # $upstream_response_time are the accuracy-bench reference of РH5/М8.
    log_format recon
        'proto=$server_protocol method=$request_method uri=$uri '
        'status=$status req_len=$request_length body_bytes=$body_bytes_sent '
        'sent=$bytes_sent te=$sent_http_transfer_encoding '
        'up_te=$upstream_http_transfer_encoding cl=$sent_http_content_length '
        'rt=$request_time urt=$upstream_response_time alpn=$ssl_alpn_protocol '
        'ka=$connection_requests id=$request_id ua="$http_user_agent"';

    sendfile on;          # nginx's default, and the reason for РH4's body_unseen
    tcp_nopush on;
    keepalive_timeout 65;
    client_header_buffer_size 1k;      # 16 KB heads must take the large path
    large_client_header_buffers 8 32k;

    upstream backend { server 127.0.0.1:8082; keepalive 4; }

    server {                      # plaintext HTTP/1.x — the corpus workhorse
        listen 8080 default_server;
        access_log /var/log/nginx/recon.log recon;
        root /srv/static;

        location = /hello    { alias /srv/static/hello.txt; }
        location = /big      { alias /srv/static/big.bin; }
        location = /huge     { alias /srv/static/huge.bin; }
        location = /boom     { return 500 "boom\n"; }
        location = /redirect { return 302 /hello.txt; }

        # Same bytes as /big, written through the socket instead of sendfile(2)
        # — the A/B half of reconnaissance item 1.
        location /nosendfile/ { sendfile off; alias /srv/static/; }

        location /proxy/  { proxy_pass http://backend/; proxy_http_version 1.1;
                            proxy_set_header Connection ""; }
        location /json/   { proxy_pass http://backend; proxy_http_version 1.1;
                            proxy_set_header Connection ""; }
        location = /auto     { proxy_pass http://backend; proxy_http_version 1.1;
                               proxy_set_header Connection ""; }
        location = /echo     { proxy_pass http://backend; proxy_http_version 1.1;
                               proxy_set_header Connection ""; proxy_request_buffering off; }
        location = /chunked  { proxy_pass http://backend; proxy_http_version 1.1;
                               proxy_set_header Connection ""; proxy_buffering off; }
        location = /slow     { proxy_pass http://backend; proxy_http_version 1.1;
                               proxy_set_header Connection ""; }
        location = /truncate { proxy_pass http://backend; proxy_http_version 1.1;
                               proxy_set_header Connection ""; }
        location = /ws       { proxy_pass http://backend; proxy_http_version 1.1;
                               proxy_set_header Upgrade $http_upgrade;
                               proxy_set_header Connection "upgrade";
                               proxy_read_timeout 10s; }

        location / { }                    # static, sendfile on
    }

    server {                      # cleartext h2 (prior knowledge): PRI preface
        listen 8081;
        http2 on;
        access_log /var/log/nginx/recon.log recon;
        root /srv/static;
        location = /hello { alias /srv/static/hello.txt; }
        location /json/   { proxy_pass http://backend; proxy_http_version 1.1;
                            proxy_set_header Connection ""; }
        location / { }
    }

    server {                      # TLS with ALPN: what really negotiates h2
        listen 8443 ssl;
        http2 on;
        ssl_certificate     /etc/nginx/tls/server-cert.pem;
        ssl_certificate_key /etc/nginx/tls/server-key.pem;
        access_log /var/log/nginx/recon.log recon;
        root /srv/static;
        location = /hello { alias /srv/static/hello.txt; }
        location = /big   { alias /srv/static/big.bin; }
        location /json/   { proxy_pass http://backend; proxy_http_version 1.1;
                            proxy_set_header Connection ""; }
        location / { }
    }
}
